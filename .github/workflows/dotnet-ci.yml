
name: Dotnet CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Test.Tests/Test.Tests.csproj

      - name: Build Application
        run: dotnet build Test.Tests/Test.Tests.csproj --configuration Release --no-restore

      - name: Run xUnit Test Cases
        run: dotnet test Test.Tests/Test.Tests.csproj --configuration Release --no-build
